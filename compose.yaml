name: family-school
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_school
      POSTGRES_DB: family_school
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Run npm run db:local:setup first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - school_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_school -d family_school"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  school_data:
